# docker compose up --build            -> postgres, redis, migrations, api (:8000), worker
# docker compose up -d postgres redis  -> infrastructure only (run api/worker locally with npm)
services:
  postgres:
    image: postgres:16
    environment:
      {
        POSTGRES_USER: campaign,
        POSTGRES_PASSWORD: campaign,
        POSTGRES_DB: campaign,
      }
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      {
        test: ["CMD-SHELL", "pg_isready -U campaign"],
        interval: 3s,
        timeout: 3s,
        retries: 20,
      }

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"] # AOF so queued jobs survive a Redis restart
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      {
        test: ["CMD", "redis-cli", "ping"],
        interval: 3s,
        timeout: 3s,
        retries: 20,
      }

  migrate:
    build: .
    command:
      ["npx", "prisma", "migrate", "deploy", "--config", "prisma7.config.ts"]
    environment: &env
      DATABASE_URL: postgresql://campaign:campaign@postgres:5432/campaign
      REDIS_URL: redis://redis:6379
      PORT: "8000"
    depends_on: { postgres: { condition: service_healthy } }

  api:
    build: .
    command: ["npx", "tsx", "src/server.ts"]
    environment: *env
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build: .
    command: ["npx", "tsx", "src/workers/index.ts"]
    environment: *env
    stop_grace_period: 30s # lets in-flight jobs finish on SIGTERM
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes: { pgdata: {}, redisdata: {} }
